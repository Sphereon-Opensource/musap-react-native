MusapRn_kotlinVersion=1.9.0
MusapRn_minSdkVersion=24
MusapRn_targetSdkVersion=35
MusapRn_compileSdkVersion=35
MusapRn_ndkversion=27.1.12297006

org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
android.useAndroidX=true
android.enableJetifier=true
